<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="80%" fx="50%" fy="20%">
      <stop offset="0%" stop-color="#241733" />
      <stop offset="50%" stop-color="#120c1a" />
      <stop offset="100%" stop-color="#09060d" />
    </radialGradient>

    <!-- Purple/Gold Glows -->
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c98ed6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="goldCrown" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#FF9900" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGlow)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="200" cy="150" r="280" fill="#a855f7" opacity="0.15" filter="blur(60px)" />
  <circle cx="1000" cy="450" r="320" fill="#ec4899" opacity="0.12" filter="blur(70px)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Top Pill Badge -->
  <g transform="translate(420, 50)">
    <rect width="360" height="42" rx="21" fill="rgba(201, 142, 214, 0.15)" stroke="rgba(201, 142, 214, 0.4)" stroke-width="1.5" />
    <text x="180" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" fill="#dfbce8" text-anchor="middle" letter-spacing="1.2">🚀 THE #1 MARKETING &amp; SAAS DIRECTORY</text>
  </g>

  <!-- Main Headline -->
  <text x="600" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="-1">
    Where The Best Marketing Tactics &amp;
  </text>
  <text x="600" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#purpleGlow)" text-anchor="middle" letter-spacing="-1">
    SaaS Tools Battle For #1.
  </text>

  <!-- Subheadline -->
  <text x="600" y="280" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" fill="#9ca3af" text-anchor="middle">
    Submit for Free • Permanent Dofollow Backlink • Live Community Push Ups
  </text>

  <!-- Card Mockup on Bottom -->
  <g transform="translate(180, 320)">
    <!-- Main Card Body -->
    <rect width="840" height="230" rx="20" fill="url(#cardGrad)" stroke="rgba(201, 142, 214, 0.4)" stroke-width="2" />

    <!-- Rank 1 Crown Badge -->
    <g transform="translate(30, 25)">
      <rect width="60" height="34" rx="10" fill="url(#goldCrown)" />
      <path d="M22 25L20 15L25 18L30 13L35 18L40 15L38 25H22Z" fill="#140a00" />
      <text x="48" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#140a00">#1</text>
    </g>

    <!-- Card Brand Info -->
    <text x="105" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="#ffffff">MarketingDB.lol</text>
    <text x="310" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#9ca3af">• Live Leaderboard Directory</text>

    <!-- Card Tagline -->
    <text x="30" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#c98ed6">
      "Promote your SaaS, landing page, or winning ad creatives with 100% Free Dofollow SEO backlinks."
    </text>

    <!-- Badges inside card -->
    <g transform="translate(30, 130)">
      <rect width="110" height="30" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="55" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb" text-anchor="middle">Meta Ads</text>
    </g>
    <g transform="translate(150, 130)">
      <rect width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="65" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb" text-anchor="middle">Landing Pages</text>
    </g>
    <g transform="translate(290, 130)">
      <rect width="110" height="30" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="55" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb" text-anchor="middle">Ecom Pages</text>
    </g>
    <g transform="translate(410, 130)">
      <rect width="130" height="30" rx="8" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" />
      <text x="65" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e5e7eb" text-anchor="middle">Dropshipping</text>
    </g>

    <!-- Vote Button Pill on Right -->
    <g transform="translate(620, 120)">
      <rect width="190" height="46" rx="23" fill="linear-gradient(135deg, #c98ed6 0%, #a855f7 100%)" />
      <text x="95" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="900" fill="#ffffff" text-anchor="middle">🚀 PUSH UP #1</text>
    </g>
  </g>

  <!-- Footer Branding -->
  <text x="600" y="590" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#6b7280" text-anchor="middle">
    https://marketingdb.lol • Built for Marketers &amp; Founders
  </text>
</svg>
